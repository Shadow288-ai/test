name: QA CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout your code
      - uses: actions/checkout@v4

      # 2) Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3) Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4) Run tests and produce a JUnit XML report
      - name: Run Vitest and write JUnit XML
        run: |
          mkdir -p qa-results
          npx vitest run \
            --reporter=junit --outputFile.junit=qa-results/vitest-results.xml

      # 5) Upload the XML test report as an artifact
      - name: Upload test results (JUnit XML)
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: qa-results/vitest-results.xml

      # (Optional) 6) Show XML report in GitHub UI test summary
      - name: Publish test report in UI
        uses: dorny/test-reporter@v2
        with:
          name: Unit Tests
          path: qa-results/vitest-results.xml
          reporter: java-junit
