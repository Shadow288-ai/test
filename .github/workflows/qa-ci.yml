name: QA CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Run tests
        run: |
          mkdir -p qa-results
          npx vitest run \
            --reporter=json --outputFile.json=qa-results/vitest.json

      - name: Generate QA Markdown report
        run: node scripts/generate-qa-report.js

      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: qa-results/*.md
